<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #0a0a0c;
    --bg-modal: #131318;
    --bg-card: #1a1a21;
    --bg-card-hover: #1f1f28;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.62);
    --text-mute: rgba(255,255,255,0.42);
    --accent: #ffd400;
    --accent-text: #0a0a0c;
    --highlight: #b288ff;
    --pro: #ffba5c;
    --team: #6dffb8;
    --check: rgba(255,255,255,0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    color: var(--text);
    font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  body { overflow-x: hidden; }
  #root { width: 100%; }
</style>
</head>
